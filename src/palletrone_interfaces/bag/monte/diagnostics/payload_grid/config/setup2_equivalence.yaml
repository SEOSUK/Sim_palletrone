experiment:
  mode: payload_grid
  x_factors: [1.0]
  y_factors: [1.0]
  trials_per_point: 5
  base_seed: 7000
  common_random_numbers: true
  resume: true
  process_timeout_s: 120.0
  executable_args: [mission_only]
model_overrides:
  model.initial_position: [0.0, 0.0, 0.7]
  model.initial_rpy: [0.0, 0.0, 0.0]
paths:
  model: src/palletrone_interfaces/config/model.yaml
  control: src/palletrone_interfaces/config/control.yaml
  command: src/palletrone_interfaces/config/command.yaml
  scene: src/plant/xml/scene.xml
logging:
  save_all_full_csv: true
  save_failures: true
  save_representatives: false
success_criteria: {}
uncertainties:
  parameter_randomization_enabled: false
