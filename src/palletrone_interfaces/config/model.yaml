# World: Z-up. Body: FLU (x forward, y left, z up). Angles are radians.
model:
  vehicle_mass: 4.2 # unloaded vehicle total, including four rotors [kg]
  # Bare base-body inertia about its own CoM. Together with the four explicit
  # rotor bodies this reproduces J_unloaded = [0.110, 0.072, 0.083] kg m^2.
  base_inertia: [0.09062181, 0.05262181, 0.04652020]
  nominal_inertia: [0.0768, 0.0871, 0.113] # controller/DOB rigid-body approximation, kg m^2
  payload:
    mass: 0.5 # [kg]
    # Setup 2 measurement is FRD [0.31, -0.31, -0.56]; FRD -> FLU is [x, -y, -z].
    position: [0.31, 0.31, 0.56] # canonical simulator/RViz FLU body coordinates [m]
  initial_com_estimate: [0.0, 0.0, 0.0] # estimator prior; independent of actual CoM
  gravity: 9.81
  initial_position: [0.0, 0.0, 0.145]
  initial_rpy: [0.0, 0.0, 0.0]
  rotor_mass: 0.2
  rotor_inertia: [0.0003, 0.0003, 0.0003]
  rotor_com: [0.0, 0.0, -0.0466612] # relative to thrust site, in rotor frame
  arm_xy: 0.148492
  rotor_z: 0.07 # thrust-site height relative to base origin (0.145 - 0.075)
  servo_pivot_offset: 0.075
  motor:
    thrust_coefficient: 0.02 # N/(rad/s)^2, distinct from reaction torque ratio
    reaction_ratio: 0.02 # Nm/N; spin signs + - + -
    max_thrust: 50.0 # N per rotor
    delay_s: 0.01
    time_constant_s: 0.017 # dynamic lag only; static gain is motor.thrust_scale
    effectiveness:
      enabled: true
      initial: 0.6966
      slope_per_s: -0.000844
      min: 0.63
      max: 0.70
  servo:
    limit_rad: 0.7
    dc_gain: 0.994
    joint_damping: 0.1
    armature: 0.0001
    max_torque: 2.0 # Nm
    delay_s: 0.05 # command transport delay; joint/PD supplies the physical response
  sensors:
    delay_s: 0.0 # transport delay on the entire sampled state, independent of actuator delay
    # Effective high-frequency uncertainty of the logged state-estimator output.
    position_std: [0.00019, 0.00022, 0.00017]
    velocity_std: [0.00473, 0.00500, 0.00368]
    attitude_std: [0.00071, 0.00067, 0.00044]
    gyro_std: [0.0236, 0.0215, 0.0174]
    servo_std: 0.0001
    seed: 1
  disturbance:
    force_world: [0.0, 0.0, 0.0] # N, applied at total CoM
    torque_body: [0.0, 0.0, 0.0] # Nm
    start_s: 0.0
    end_s: 1000000.0
  residual_torque:
    enabled: true
    frame: body
    # Gray-box calibration from the mandatory initial guess [0.163, 0.108, 0.056]
    # and [0.60, 0.71, 0.94], using only Complete-window DOB STD/correlation statistics.
    std_nm: [0.0891, 0.0807, 0.0323]
    correlation_time_s: [0.296, 0.586, 0.616]
    seed: 1
  residual_force:
    enabled: true
    frame: body
    std_n: [0.514, 1.266, 0.981]
    correlation_time_s: [0.25, 0.62, 0.27]
    seed: 1
simulation:
  physics_hz: 400.0
  state_hz: 400.0
  realtime_factor: 1.0
  viewer_hz: 60.0
  command_timeout_s: 0.5
